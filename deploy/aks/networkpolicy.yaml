apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: appcontratos-zero-trust
  namespace: contratos-prod
  labels:
    app.kubernetes.io/name: appcontratos
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: appcontratos
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
