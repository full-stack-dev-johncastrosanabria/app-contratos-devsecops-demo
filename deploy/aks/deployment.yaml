apiVersion: apps/v1
kind: Deployment
metadata:
  name: appcontratos
  namespace: contratos-prod
  labels:
    app.kubernetes.io/name: appcontratos
    app.kubernetes.io/part-of: nextgen-devsecops-assessment
    app.kubernetes.io/managed-by: github-actions
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: appcontratos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: appcontratos
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contratos-web
          image: ghcr.io/full-stack-dev-johncastrosanabria/nextgen-devsecops-assessment:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: APP_VERSION
              value: "v1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/salud
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/salud
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: datos-efimeros
              mountPath: /app/data
      volumes:
        - name: datos-efimeros
          emptyDir:
            sizeLimit: 16Mi
