# Guion narrado de la demo REN-001 (python -m demo). Con voz no hay subtítulos; sin audio (--sin-voz,
# ensayo o un clip que falla) cada línea se muestra como subtítulo.
# Los pasos con «motor» solo corren con ese motor; el ensayo usa solo-evidencia.
# Los botones que se arman con doble pulsación cambian de texto: se ubican por CSS, nunca por su nombre.
voz: es-MX-DaliaMultilingualNeural
escenas:
  - id: portada
    titulo: Portada
    pasos:
      - tipo: slide
        plantilla: portada
        titulo: NextGen DevSecOps Assessment
        subtitulo: Evidencia verificable de cada entrega, en las ocho etapas del ciclo DevSecOps
        voz: >-
          Les doy la bienvenida. En los próximos minutos les voy a mostrar cómo responder, con evidencia
          verificable, una pregunta que hoy cuesta horas: si una entrega está lista para producción.

  - id: pregunta
    titulo: La pregunta
    pasos:
      - tipo: slide
        plantilla: pregunta
        pregunta: ¿Qué evidencia tenemos de que esta versión cumple lo acordado?
        fuentes: [Azure Boards, GitHub, Pipelines, Azure Monitor]
        remate: Un pipeline en verde no equivale a evidencia.
        voz: >-
          Cuando un equipo despliega una versión nueva, solemos ver los checks en verde y dar por hecho que
          todo está cubierto. Pero si un auditor pregunta qué evidencia tenemos de que cumple los criterios
          de negocio, pasó los controles de seguridad y no degradó el ambiente, la respuesta está repartida
          entre Boards, GitHub, los pipelines y Azure Monitor.

  - id: consola
    titulo: La consola
    pasos:
      - tipo: narrar
        foco: ".masthead .brand"
        etiqueta: Consola del evaluador
        voz: >-
          Esta es la consola del evaluador: un agente de evaluación continua construido sobre Microsoft
          Agent Framework y Azure AI Foundry.
      - tipo: narrar
        foco: "nav.ecosystem-nav"
        etiqueta: Sistemas conectados
        voz: >-
          Conecta las herramientas que el equipo ya usa: Azure Boards, GitHub, los escáneres de seguridad y
          Power BI.
      - tipo: narrar
        opcional: true
        foco: "#controls"
        etiqueta: Alcance y motor
        voz: Y desde aquí elegimos qué entregas evaluar y con qué motor.
      - tipo: narrar
        opcional: true
        foco: "#mode-select"
        etiqueta: Motor
        voz: >-
          Con agentes, la consola consume tokens de Azure AI Foundry; con solo evidencia no consume ninguno,
          y en ambos casos el dictamen lo decide la misma política.

  - id: caso
    titulo: El caso
    pasos:
      - tipo: slide
        plantilla: caso
        regla: REN-001 · Un contrato cancelado nunca genera aviso de renovación
        entregas:
          - {version: Versión 1, tono: pass, escenario: código excluye cancelados · con prueba REN-001}
          - {version: Versión 2, tono: fail, escenario: regresión funcional en cancelados}
          - {version: Versión 3, tono: warn, escenario: suite en verde sin prueba vinculada a REN-001}
        voz: >-
          Nuestro sujeto de prueba es AppContratos, una API en Azure Container Apps que avisa de cada
          renovación a treinta, siete y un día del vencimiento. En Azure Boards, la historia de negocio fija
          el criterio crítico REN-001: un contrato cancelado nunca debe generar un aviso, para no contactar
          por error a quien ya dejó de ser cliente. Vamos a evaluar tres entregas candidatas, cada una
          construida para un escenario distinto.
      - tipo: narrar
        opcional: true
        foco: "#ledger-head .ver-scenario"
        etiqueta: Escenario de cada entrega
        voz: >-
          En la consola, cada entrega muestra su escenario en la cabecera de la matriz: es la intención con
          que se construyó, no el dictamen.
      - tipo: narrar
        opcional: true
        voz: >-
          La historia fija además un segundo criterio, REN-002: aunque se evalúe varias veces el mismo día,
          cada contrato activo recibe un único aviso.

  - id: ejecutar
    titulo: Ejecutar
    pasos:
      - tipo: elegir
        selector: "#scope-select"
        valor: todas
      - tipo: elegir
        motor: agente
        selector: "#mode-select"
        valor: agente
      - tipo: elegir
        motor: solo-evidencia
        selector: "#mode-select"
        valor: solo-evidencia
      - tipo: clic
        motor: agente
        selector: "#run-btn"
        confirmar: true
        voz: Elegimos las tres entregas y el motor con agentes, y ejecutamos.
      - tipo: clic
        motor: solo-evidencia
        selector: "#run-btn"
        confirmar: true
        voz: Elegimos las tres entregas y el motor de solo evidencia, sin tokens, y ejecutamos.

  - id: mientras-corre
    titulo: Mientras corre
    pasos:
      - tipo: slide
        motor: agente
        plantilla: maf
        voz: >-
          Mientras corre, veamos qué pasa tras bambalinas. Un recolector reúne la evidencia de cada entrega
          con su huella criptográfica. Luego el flujo se abre en tres agentes en paralelo, y al final todo
          converge en una política determinista: los agentes investigan y explican, pero el dictamen lo
          emite código.
      - tipo: slide
        motor: solo-evidencia
        plantilla: maf
        voz: >-
          Así funciona con agentes: tres investigadores en paralelo que convergen en una política
          determinista. Con el motor de solo evidencia el flujo los omite: el recolector y la misma política
          emiten el dictamen, sin consumir tokens.
      - tipo: narrar
        foco: "#ledger"
        etiqueta: Matriz de evaluación
        voz: "Volvamos a la consola: la matriz se llena en vivo."
      - tipo: esperar
        motor: agente
        condicion: &dictamenes >-
          document.querySelector('#ledger').dataset.running === 'false' &&
          ['v1', 'v2', 'v3'].every((v) =>
            ['pass', 'fail', 'unknown'].includes(document.querySelector(`#ledger-head th.ledger-ver[data-ver="${v}"]`)?.dataset.verdict) &&
            document.querySelector(`#card-${v} .provenance-chip`)?.dataset.live === 'true')
        max_s: 420
        espera_s: [150, 210]
        en_vivo: los agentes evalúan las tres entregas
        # La tarjeta con error solo se ve con su pestaña activa: primero la pestaña, luego «Reintentar vN con Solo evidencia».
        si_error: &reintento >-
          #results .card-alert:not([hidden]) .btn-inline-action[data-eval]:not([disabled]),
          #dossier-tabs .dossier-tab[data-verdict="error"][aria-selected="false"]
        voz_mientras:
          - >-
            Primero, el recolector fija la evidencia: el commit, el reporte de pruebas y el estado en Boards,
            GitHub y Azure, cada artefacto con su huella.
          - >-
            Después trabajan los tres agentes. El de calidad y trazabilidad decide qué pruebas inspeccionar
            y busca, para cada criterio, una prueba que lo ejercite de verdad.
          - El de seguridad cruza SonarQube, Trivy y CodeQL con la postura de Defender for Cloud.
          - Y el de operación y gobierno compara la telemetría reciente de Application Insights con su línea base.
          - >-
            Cada hallazgo lleva su alcance: la versión, el recurso o el ambiente, para no mezclar
            responsabilidades.
          - >-
            Un detalle importante: si un agente no responde a tiempo, la consola lo registra como diagnóstico
            operativo y el dictamen no cambia: lo decide la política.
          - >-
            Una pregunta frecuente: ¿qué pasa si el modelo alucina que una prueba existe o que pasó? No puede
            alterar el resultado: cada archivo, línea y ejecución que cita se contrasta con el código fuente y
            el reporte de pruebas.
          - >-
            Otra: ¿y si alguien deja instrucciones en un comentario del código para engañar al agente? Las
            herramientas tratan el código y los reportes como datos de solo lectura, y al correr las pruebas
            se retiran del entorno las credenciales de IA.
          - >-
            Y todo lo que toca la demo es reversible: el reinicio archiva las corridas, restaura el código y
            retira de Boards las tareas de prueba.
        # Solo suena si la evaluación sigue en curso; nada aquí depende del motor.
        relleno: &relleno
          - >-
            ¿Sirve solo para este stack? No: los recolectores están desacoplados, así que la misma
            arquitectura evalúa JUnit o PyTest, Azure Pipelines o Azure Repos cambiando solo el adaptador de
            lectura.
          - >-
            Toda la evaluación trabaja sobre evidencia congelada: si un archivo cambiara a mitad de camino, su
            huella dejaría de coincidir.
          - Cada corrida queda archivada con su evidencia y sus huellas, así que cualquier dictamen se puede auditar después.
          - Mientras terminan, fíjense en la matriz. Cada celda es una etapa de una entrega y enlaza con su evidencia.
      - tipo: esperar
        motor: solo-evidencia
        condicion: *dictamenes
        max_s: 240
        espera_s: [30, 90]
        en_vivo: la consola evalúa las tres entregas
        si_error: *reintento
        voz_mientras:
          - Sin modelo, la consola recolecta la evidencia de cada entrega y la política emite el dictamen, sin consumir tokens.
        relleno: *relleno

  - id: dictamen
    titulo: El dictamen
    pasos:
      - tipo: narrar
        lupa: "#ledger-head > tr.ledger-head-row"
        voz: >-
          Ahí están los tres dictámenes. La versión 1 queda verificada: una prueba vinculada a REN-001
          ejercitó el caso cancelado y pasó. La versión 2 queda incumplida: esa prueba se ejecutó y falló,
          porque se generó un aviso para un contrato cancelado.
      - tipo: clic
        selector: "#filter-diff-btn"
        voz: Con «Solo brechas», la matriz deja a la vista solo las etapas que piden revisión.
      - tipo: narrar
        opcional: true
        voz: Así, el equipo no pierde tiempo en lo que ya está en verde y va directo a lo que bloquea la entrega.

  - id: momento-v3
    titulo: El momento clave
    pasos:
      - tipo: clic
        selector: "#tab-v3"
        voz: "Y ahora, el momento clave: la versión 3. Abramos su expediente."
      - tipo: narrar
        foco: "#card-v3 .card-proof-band"
        etiqueta: Pruebas de la versión 3
        voz: >-
          Sus pruebas están en verde: la suite completa pasó, sin fallos. En un proceso tradicional, esta
          versión pasaría derecho a producción.
      - tipo: clic
        selector: '.ledger-cell-btn[data-stage="4"][data-ver="v3"]'
        voz: Veamos su etapa de integración y pruebas.
      - tipo: narrar
        foco: "#stage-inspector-body .inspector-answer-block"
        etiqueta: Respuesta en v3
        voz: >-
          Pero ninguna de esas pruebas está vinculada a REN-001: nadie comprobó qué pasa con un contrato
          cancelado.
      - tipo: narrar
        foco: '#ledger-head th.ledger-ver[data-ver="v3"]'
        etiqueta: Dictamen de la versión 3
        voz: >-
          Por eso el dictamen es evidencia insuficiente: código en verde sin evidencia del criterio no se
          certifica.
      - tipo: narrar
        motor: agente
        opcional: true
        voz: Con agentes, el de calidad revisa además el código de las pruebas para explicar por qué falta esa evidencia.

  - id: etapas
    titulo: Las 8 etapas
    pasos:
      - tipo: slide
        plantilla: etapas
        etapas: [Planificar, Crear código, Asegurar desde el origen, Integrar y probar, Desplegar, Operar, Observar y aprender, Optimizar con IA]
        voz: >-
          Este rigor se aplica a las ocho etapas del ciclo: cuatro del lado del código y la evidencia, y
          cuatro del lado de la nube y el gobierno. Sigamos el recorrido en la versión 3.
      # Con «Solo brechas» activo, «Siguiente» se salta las etapas sin nada que revisar.
      - tipo: clic
        selector: "#filter-diff-btn"
      - tipo: clic
        selector: "#inspector-next-btn"
      - tipo: narrar
        opcional: true
        voz: "Desplegar: que la revisión activa en Container Apps corresponda al commit evaluado."
      - tipo: clic
        selector: "#inspector-next-btn"
      - tipo: narrar
        opcional: true
        voz: "Operar: la postura de Defender for Cloud sobre el recurso."
      - tipo: clic
        selector: "#inspector-next-btn"
      - tipo: narrar
        opcional: true
        voz: "Observar y aprender: la telemetría reciente frente a su línea base."
      - tipo: clic
        selector: "#inspector-next-btn"
      - tipo: narrar
        opcional: true
        voz: "Optimizar con IA: la remediación gobernada, que veremos enseguida."
      # Después de la etapa 8 el inspector vuelve a la 1; termina en la 3, donde empieza la escena siguiente.
      - tipo: clic
        selector: "#inspector-next-btn"
      - tipo: narrar
        opcional: true
        voz: "Y de vuelta al inicio. Planificar: la historia en Boards con sus criterios de aceptación."
      - tipo: clic
        selector: "#inspector-next-btn"
      - tipo: narrar
        opcional: true
        voz: "Crear código: el pull request vinculado a la historia."
      - tipo: clic
        selector: "#inspector-next-btn"

  - id: seguridad
    titulo: Seguridad en origen
    pasos:
      - tipo: narrar
        lupa: '#stage-inspector-body .vuln-table tbody tr:has-text("SEC-DOCKER-001")'
        voz: >-
          En la etapa 3, el reporte cruza SonarQube, Trivy y OWASP. Por ejemplo, este hallazgo: la imagen del
          contenedor corre como root, y Trivy lo marca con severidad alta.
      - tipo: clic
        selector: '#stage-inspector-body .vuln-table tbody tr:has-text("SEC-DOCKER-001") button:has-text("Corregir en Etapa 8")'
        voz: Desde la misma fila lo llevamos a la etapa 8.
      - tipo: clic
        selector: '#stage-inspector-body button:has-text("Parche determinista")'
        voz: Generamos el parche determinista, sin tokens.
      - tipo: clic
        selector: "#stage-inspector-body .rem-exec-bar .btn-approve"
        confirmar: true
        voz: Lo aplicamos y reauditamos la etapa 3.
      - tipo: esperar
        condicion: >-
          /^SEC-DOCKER-001 mitigada y auditada en Etapa 3/.test(document.querySelector('#status').textContent) &&
          document.querySelector('#status-banner').dataset.tone === 'pass'
        max_s: 120
        espera_s: [3, 15]
        en_vivo: Trivy reaudita la etapa 3
        voz_mientras:
          - >-
            Trivy vuelve a escanear el repositorio con el Dockerfile corregido. El cambio es local, y el
            reinicio de la demo lo deshace.
      - tipo: clic
        selector: '#stage-inspector-body button:has-text("Ver reporte en Etapa 3")'
      - tipo: narrar
        foco: "#stage-inspector-body .scanner-engines-grid .scanner-card:last-child"
        etiqueta: Aqua Trivy
        voz: Trivy ya no reporta misconfiguraciones de severidad alta, y el control queda verificado.
      - tipo: narrar
        opcional: true
        voz: Lo mismo vale para el resto del reporte. Cada hallazgo se investiga por separado, o se endurecen todos en lote.

  - id: gobernanza
    titulo: Gobernanza
    pasos:
      - tipo: slide
        plantilla: gobernanza
        pasos:
          - El flujo detecta la brecha y guarda un punto de control
          - {texto: Una persona revisa y aprueba, destacar: true}
          - La tarea nace en Azure Boards, hija de la historia
          - Una huella idempotente evita duplicados
        voz: >-
          Para cerrar el ciclo, el flujo no ensucia el backlog por su cuenta: guarda un punto de control y
          espera la decisión de una persona. Al aprobar, crea la tarea en Azure Boards como hija de la
          historia, con el commit exacto, la brecha y el criterio para reevaluarla.
      - tipo: clic
        selector: "#inspector-close-btn"
      - tipo: escribir
        selector: "#gov-note-v3"
        texto: Cubrir el caso cancelado antes de producción
      - tipo: clic
        selector: "#card-v3 .gov-buttons .btn-approve"
        voz: En la demo pulsamos nosotros; en la operación real, esta aprobación la da una persona del equipo.
      # «Aprobar» abre un recuadro de confirmación y, tras confirmar, deja 5 s para deshacer antes de enviar.
      - tipo: clic
        selector: "#card-v3 .gov-confirm-bar .btn-approve"
      - tipo: esperar
        condicion: >-
          /^AB#\d+$/.test(document.querySelector('#card-v3 .gov-panel[data-state="APROBADA"] .gov-result a span')?.textContent || '') &&
          /sin duplicados en Boards/.test(document.querySelector('#card-v3 .gov-result').textContent)
        max_s: 90
        espera_s: [6, 12]
        en_vivo: enviando la tarea a Azure Boards
        voz_mientras:
          - Hay cinco segundos para deshacer; después, la aprobación queda registrada en Azure Boards.
      - tipo: narrar
        lupa: "#card-v3 .gov-result"
        voz: Aquí está la tarea recién creada, hija de la historia de negocio.
      - tipo: narrar
        opcional: true
        voz: >-
          Y gracias a una huella determinista, si mañana se reevalúa y la tarea sigue abierta, se comenta en
          la misma tarea en lugar de duplicarla.

  - id: remediacion
    titulo: Remediación
    pasos:
      - tipo: clic
        selector: "#card-v3 .remediation .rem-actions .btn-ghost"
        voz: Ahora, la remediación. Generamos la corrección con la plantilla de contingencia, sin consumir tokens.
      - tipo: narrar
        foco: "#card-v3 .rem-output"
        etiqueta: Corrección propuesta
        voz: "La propuesta agrega la prueba que faltaba, vinculada a REN-001: un contrato cancelado no debe generar ningún aviso."
      # «Aplicar en local y reevaluar» reevalúa con el motor elegido: con solo evidencia no gasta tokens.
      - tipo: elegir
        selector: "#mode-select"
        valor: solo-evidencia
      - tipo: clic
        selector: "#card-v3 .rem-exec-bar .btn-approve"
        confirmar: true
        voz: Aplicamos en local y reevaluamos.
      - tipo: esperar
        condicion: document.querySelector('#card-v3')?.dataset.verdict === 'pass'
        max_s: 150
        espera_s: [18, 35]
        en_vivo: reevaluando la versión 3
        voz_mientras:
          - "Para reevaluar no hace falta el modelo: el dictamen lo emite la misma política determinista, sin tokens."
          - >-
            Mientras tanto, la consola guarda un respaldo del archivo original, escribe la corrección y vuelve
            a correr las pruebas. Todo es reversible: un clic restaura el código original.
      - tipo: narrar
        foco: '#ledger-head th.ledger-ver[data-ver="v3"], #ledger .ledger-cell-btn[data-ver="v3"]'
        etiqueta: Versión 3
        voz: "La versión 3 pasa a verificada: ahora sí hay evidencia del criterio."
      - tipo: clic
        selector: "#card-v3 .governance .gov-panel > .btn-approve"
        voz: Y como la entrega quedó verificada, cerramos la tarea en Azure Boards.
      - tipo: esperar
        condicion: >-
          /^Tarea cerrada tras verificación determinista/.test(document.querySelector('#card-v3 .gov-result')?.textContent || '')
        max_s: 90
        espera_s: [2, 10]
        en_vivo: cerrando la tarea en Azure Boards
        voz_mientras:
          - El ciclo termina con la misma trazabilidad con que empezó.
      - tipo: narrar
        opcional: true
        voz: Si prefieren su flujo de revisión habitual, la misma corrección puede salir como rama y pull request en GitHub.

  - id: valor
    titulo: Valor continuo
    pasos:
      - tipo: narrar
        foco: "#value-kpis"
        etiqueta: Valor continuo
        voz: "Cada corrida alimenta estos indicadores: controles con evidencia, criterios vigentes y el ciclo en Boards."
      - tipo: clic
        selector: "#open-powerbi-web-btn"
        voz: Y con un clic, la consola los publica en Power BI.
      - tipo: esperar
        condicion: >-
          /^Reporte ejecutivo actualizado en Power BI Web/.test(document.querySelector('#status').textContent) &&
          document.querySelector('#status-banner').dataset.tone === 'pass'
        max_s: 60
        espera_s: [3, 8]
        en_vivo: la consola sincroniza las corridas con Power BI
        voz_mientras: Lo hace con la API de Power BI, sin exportar archivos ni copiar hojas de cálculo.
      # El reporte se ve dentro de la demo; la pestaña que abriría la consola queda bloqueada (SIN_VENTANA_POWERBI).
      - tipo: reporte
        titulo: Reporte ejecutivo de Power BI
        max_s: 60
        espera_s: [4, 12]
        voz: >-
          Este es el reporte ejecutivo en Power BI, con las corridas de esta demo: las auditadas, el
          cumplimiento de REN-001 y la evidencia determinista. El comité de release lo sigue sin abrir la consola.
      - tipo: narrar
        opcional: true
        voz: Las mismas corridas también se exportan en CSV y en JSON para Microsoft Fabric.

  - id: cierre
    titulo: Cierre
    pasos:
      - tipo: slide
        plantilla: cierre
        tesis:
          - Los agentes investigan; una política determinista decide
          - Un pipeline en verde no equivale a evidencia del criterio
          - Ninguna tarea entra al backlog sin una decisión humana
        cta: Una aplicación crítica · sus dos últimas entregas · dos semanas
        voz: >-
          Para aterrizarlo en su contexto, les propongo algo concreto: elijamos una aplicación crítica y sus
          dos últimas entregas. Conectamos este mismo flujo sobre su Boards, su pipeline y su suscripción de
          Azure, y en dos semanas tienen su línea base de controles verificados. Gracias.
