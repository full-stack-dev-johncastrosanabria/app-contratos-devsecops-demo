name: Evidencia de contratos
on: [push, pull_request, workflow_dispatch]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/Contratos.Tests --logger "trx;LogFileName=resultados.trx" --results-directory evidencia
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ github.sha }}
          path: evidencia/*.trx
