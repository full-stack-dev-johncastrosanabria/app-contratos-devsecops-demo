name: NextGen DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_version:
        description: "Versión de AppContratos a empaquetar"
        type: choice
        options: [v1, v3]
        required: false
        default: "v1"

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  pruebas-xunit:
    name: Evidencia xUnit (${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [v1, v2, v3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Validar pruebas xUnit y capturar evidencia
        run: python3 -m assessment.ci ${{ matrix.version }} evidencia-${{ matrix.version }}
      - name: Publicar TRX y log de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-${{ matrix.version }}-${{ github.sha }}
          path: |
            evidencia-${{ matrix.version }}/*/resultados.trx
            evidencia-${{ matrix.version }}/*/dotnet-test.log
          if-no-files-found: error

  codeql:
    name: Seguridad en origen (CodeQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: "10.0.x"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  trivy:
    name: Escaneo IaC, contenedor y SCA (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Trivy sobre sistema de archivos, Dockerfile y manifiestos AKS
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
      - name: Publicar SARIF de Trivy en GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "/tool:trivy"

  publicar-imagen:
    name: Construir imagen OCI (GHCR)
    runs-on: ubuntu-latest
    needs: pruebas-xunit
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar contenedor
        env:
          TARGET_VER: ${{ inputs.app_version || 'v1' }}
        run: |
          case "${TARGET_VER}" in
            v1|v3) ;;
            *) echo "::error::Versión no publicable: ${TARGET_VER}"; exit 1 ;;
          esac
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build \
            --build-arg APP_VERSION="${TARGET_VER}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${TARGET_VER}" \
            -t "ghcr.io/${REPO_LOWER}:${TARGET_VER}" \
            -t "ghcr.io/${REPO_LOWER}:${{ github.sha }}" \
            -t "ghcr.io/${REPO_LOWER}:latest" .
          docker push "ghcr.io/${REPO_LOWER}:${TARGET_VER}"
          docker push "ghcr.io/${REPO_LOWER}:${{ github.sha }}"
          docker push "ghcr.io/${REPO_LOWER}:latest"
