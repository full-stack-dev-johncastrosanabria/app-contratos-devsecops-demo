<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evaluador de renovaciones · AppContratos</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="frame topbar">
      <span class="brand"><span class="brand-mark" aria-hidden="true">✓</span> AppContratos</span>
      <span class="local"><span aria-hidden="true"></span> Demo local</span>
    </div>
  </header>
  <main class="frame">
    <section class="intro" aria-labelledby="title">
      <span class="criterion">REN-001</span>
      <h1 id="title">Evaluador de renovaciones</h1>
      <p>Al evaluar renovaciones, un contrato cancelado no debe generar un aviso.</p>
      <ol class="flow" aria-label="Pasos de la evaluación">
        <li>Ejecutar xUnit</li><li>Revisar código y TRX</li><li>Emitir veredicto</li>
      </ol>
    </section>

    <form class="controls" id="controls">
      <div class="fields">
        <label>Versión
          <select name="version">
            <option value="todas">Las tres versiones</option>
            <option value="v1">Versión 1</option>
            <option value="v2">Versión 2</option>
            <option value="v3">Versión 3</option>
          </select>
        </label>
        <label>Modo
          <select name="modo" aria-describedby="mode-help">
            <option value="solo-evidencia">Solo evidencia</option>
            <option value="agente">Con agente de QA</option>
          </select>
        </label>
        <button type="submit">Ejecutar evaluación <span aria-hidden="true">→</span></button>
      </div>
      <p id="mode-help">Revisa la evidencia local sin llamar al modelo.</p>
    </form>

    <section class="results" aria-labelledby="results-title">
      <div class="results-head">
        <h2 id="results-title">Resultados</h2>
        <p id="status" role="status">Listo para ejecutar</p>
      </div>
      <div class="cards" id="results" aria-busy="false"></div>
    </section>
  </main>

  <template id="version-card">
    <article class="card">
      <div class="card-head"><h3></h3><span class="badge" data-state="idle">Sin ejecutar</span></div>
      <p class="reason">El veredicto aparecerá después de ejecutar esta versión.</p>
      <div class="evidence"></div>
      <div class="downloads"></div>
    </article>
  </template>
</body>
</html>
